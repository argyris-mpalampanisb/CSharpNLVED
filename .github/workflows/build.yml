name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: macos-latest,   rid: osx-arm64 }
          - { os: macos-latest,   rid: osx-x64 }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Work out version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: dotnet test --project tests/CSharpNLVED.Core.Tests/CSharpNLVED.Core.Tests.csproj -c Release

      - name: Publish (self-contained, single file)
        shell: bash
        run: >
          dotnet publish src/CSharpNLVED.App/CSharpNLVED.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${APP_VERSION}
          -o out/CSharpNLVED

      - name: Package
        shell: bash
        run: |
          cp LICENSE out/CSharpNLVED/
          # Debug symbols are over a third of the Windows download.
          rm -f out/CSharpNLVED/*.pdb
          cd out
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a "../CSharpNLVED-${{ matrix.rid }}.zip" CSharpNLVED
          else
            tar -czf "../CSharpNLVED-${{ matrix.rid }}.tar.gz" CSharpNLVED
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: CSharpNLVED-${{ matrix.rid }}
          path: CSharpNLVED-${{ matrix.rid }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # Tags with a suffix (v0.1.0-alpha) become pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
